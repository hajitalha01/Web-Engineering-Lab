<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Web Engineering Welcome Page</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gradient-to-br from-slate-900 to-indigo-950 min-h-screen text-slate-100 flex items-center justify-center p-4">

    <div class="max-w-md w-full bg-slate-800/80 backdrop-blur-md border border-slate-700 p-8 rounded-2xl shadow-2xl text-center space-y-6">
        
        <div class="inline-block p-4 bg-indigo-600/20 text-indigo-400 rounded-full mb-2">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-10 w-10 mx-auto" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 20l4-16m4 4l4 4-4 4M6 16l-4-4 4-4" />
            </svg>
        </div>

        <h1 class="text-3xl font-bold tracking-tight text-white">Web Engineering</h1>
        <p class="text-slate-400 text-sm">Welcome to your new project! Click the button below to test the JavaScript interaction.</p>

        <div id="output-box" class="hidden p-3 bg-indigo-900/50 border border-indigo-700/50 text-indigo-200 rounded-lg text-sm font-medium transition-all duration-300">
            🎉 Success! Your HTML, CSS, and JavaScript are working perfectly together!
        </div>

        <button id="action-btn" class="w-full py-3 px-4 bg-indigo-600 hover:bg-indigo-500 text-white font-semibold rounded-xl shadow-lg transition duration-200 transform active:scale-95">
            Test JavaScript
        </button>
    </div>

    <script>
        const button = document.getElementById('action-btn');
        const outputBox = document.getElementById('output-box');

        button.addEventListener('click', () => {
            outputBox.classList.toggle('hidden');
            if (!outputBox.classList.contains('hidden')) {
                button.textContent = 'Reset';
                button.classList.replace('bg-indigo-600', 'bg-slate-700');
                button.classList.replace('hover:bg-indigo-500', 'hover:bg-slate-600');
            } else {
                button.textContent = 'Test JavaScript';
                button.classList.replace('bg-slate-700', 'bg-indigo-600');
                button.classList.replace('hover:bg-slate-600', 'hover:bg-indigo-500');
            }
        });
    </script>

</body>
</html>
