
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Welcome to Cat Store</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
        }

        /* Full background image section */
        .hero {
            width: 100%;
            min-height: 100vh;
            background-image: url("https://mamp.one/wp-content/uploads/2024/09/image-resources2.jpg");
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;

            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 30px 20px;
            position: relative;
        }

        /* Dark overlay on image */
        .hero::before {
            content: "";
            position: absolute;
            inset: 0;
            background: rgba(0, 0, 0, 0.35);
        }

        /* Heading on image */
        .hero h1 {
            color: white;
            font-size: clamp(36px, 6vw, 65px);
            text-shadow: 3px 3px 8px black;
            margin-bottom: 20px;
            position: relative;
            z-index: 1;
        }

        .hero p {
            color: white;
            font-size: 20px;
            text-shadow: 2px 2px 5px black;
            margin-bottom: 30px;
            position: relative;
            z-index: 1;
        }

        /* Centered shadow box */
        .store-box {
            width: 100%;
            max-width: 500px;
            padding: 35px 25px;
            background: rgba(255, 255, 255, 0.94);
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            position: relative;
            z-index: 1;
        }

        .store-box h2 {
            color: #222;
            font-size: 30px;
            text-shadow: 1px 2px 3px #bbb;
            margin-bottom: 15px;
        }

        .store-box p {
            color: #444;
            font-size: 16px;
            line-height: 1.7;
            text-shadow: none;
            margin-bottom: 20px;
        }

        /* Button */
        .store-btn {
            display: inline-block;
            padding: 12px 28px;
            background-color: #e87535;
            color: white;
            text-decoration: none;
            font-weight: bold;
            border-radius: 25px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.25);
            transition: 0.3s;
        }

        .store-btn:hover {
            background-color: #bd5120;
            transform: translateY(-3px);
        }

        /* Mobile responsive */
        @media (max-width: 600px) {
            .hero {
                padding: 25px 15px;
            }

            .store-box {
                padding: 25px 18px;
            }

            .store-box h2 {
                font-size: 25px;
            }
        }
    </style>
</head>

<body>

    <section class="hero">

        <h1>Welcome to Cat Store</h1>

        <p>Your Lovely Place for Cat Lovers 🐱</p>

        <div class="store-box">
            <h2>Welcome, Cat Lovers!</h2>

            <p>
                Discover the wonderful world of cats.
                Find your favourite furry friends and
                make every day more special with your pets.
            </p>

            <a href="#cats" class="store-btn">Explore Now</a>
        </div>

    </section>

</body>
</html>
